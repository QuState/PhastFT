[workspace]
resolver = "2"
members = [
  "./crates/bench-criterion/",
  "./crates/bench-profile/",
  "./crates/bench-shell/",
  "./crates/phastft/",
  # temporary disable pyphastft before it is avalable
  # "./crates/pyphastft/",
  "./crates/utilities/",
]

[workspace.package]
version = "0.4.1"
authors = ["Saveliy Yusufov", "Shnatsel"]
edition = "2021"
rust-version = "1.88"
description = "A high-performance Fast Fourier Transform (FFT) library written in pure and safe Rust"
repository = "https://github.com/smu160/PhastFT"
license = "MIT OR Apache-2.0"
keywords = ["discrete", "fft", "fourier", "quantum", "transform"]
categories = ["algorithms", "mathematics", "science"]
exclude = [
  ".github",
  "assets",
  "codecov.yml",
  "hooks",
  "rust-toolchain.toml",
  "rustfmt.toml",
]

[workspace.dependencies]
phastft = { path = "./crates/phastft/" }
utilities = { path = "./crates/utilities/" }

bytemuck = { version = "1.25.0" }
criterion = "0.8.2"
fearless_simd = "0.5.0"
fftw = "0.8.0"
fftw-sys = "0.8.0"
num-complex = { version = "0.4.6", features = ["bytemuck"] }
num-traits = "0.2.19"
rand = "0.10.1"
rayon = "1.11.0"
realfft = "3.5.0"
rustfft = "6.4.1"

# for now we declare lints in lib.rs
[workspace.lints.rust]

[profile.bench]
inherits = "release"
opt-level = 3
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
