[package]
name = "phastft"
version = "0.4.1"
rust-version = "1.88"
edition = "2021"
authors = ["Saveliy Yusufov", "Shnatsel"]
license = "MIT OR Apache-2.0"
description = "A high-performance Fast Fourier Transform (FFT) library written in pure and safe Rust"
repository = "https://github.com/smu160/PhastFT"
readme = "README.md"
documentation = "https://docs.rs/phastft"
keywords = ["quantum", "fft", "discrete", "fourier", "transform"]
categories = ["algorithms", "mathematics", "science"]
exclude = [
	".github",
	"assets",
	"benches",
	"codecov.yml",
	"hooks",
	"profile.sh",
	"rust-toolchain.toml",
	"rustfmt.toml",
]

[dependencies]
num-traits = "0.2.19"
num-complex = { version = "0.4.6", features = ["bytemuck"], optional = true }
bytemuck = { version = "1.25.0", optional = true }
rayon = { version = "1.11.0", optional = true }
fearless_simd = "1.0.0"

[features]
default = ["parallel"]
complex-nums = ["dep:num-complex", "dep:bytemuck"]
parallel = ["dep:rayon"]
bench-internals = ["complex-nums"]

[dev-dependencies]
criterion = "0.8.2"
fftw = "0.8.0"
fftw-sys="0.8.0"
rand = "0.10.1"
realfft = "3.5.0"
utilities = { path = "utilities" }

[[bench]]
name = "c2c_forward"
harness = false

[[bench]]
name = "c2c_inverse"
harness = false

[[bench]]
name = "r2c"
harness = false

[[bench]]
name = "c2r"
harness = false

[[bench]]
name = "planner"
harness = false

[[bench]]
name = "interleave"
harness = false
required-features = ["bench-internals", "complex-nums"]

[[bench]]
name = "bit_reversal"
harness = false
required-features = ["bench-internals"]

[profile.profiling]
inherits = "release"
debug = true

[profile.bench]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

[package.metadata.docs.rs]
all-features = true

# for now we declare lints in lib.rs
[lints.rust]
